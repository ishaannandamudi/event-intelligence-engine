[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-intelligence-engine"
version = "1.3.0"
description = "Causal, replayable event intelligence contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eie = "eie.runtime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage>=7,<8", "ruff>=0.9,<1", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["eie"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]
